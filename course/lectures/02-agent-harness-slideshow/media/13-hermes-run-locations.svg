<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Hermes run locations">
  <rect width="1600" height="900" fill="#000000"/>

  <rect x="60" y="180" width="460" height="480" rx="12" fill="#141414" stroke="#e8e8e8" stroke-width="6"/>
  <text x="290" y="320" fill="#f2f2f2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" text-anchor="middle">Laptop</text>
  <text x="290" y="420" fill="#b0b0b0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" text-anchor="middle">class default</text>
  <rect x="570" y="180" width="460" height="480" rx="12" fill="#141414" stroke="#e8e8e8" stroke-width="6"/>
  <text x="800" y="320" fill="#f2f2f2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" text-anchor="middle">Hosted server</text>
  <text x="800" y="420" fill="#b0b0b0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" text-anchor="middle">VPS / home box</text>
  <rect x="1080" y="180" width="460" height="480" rx="12" fill="#141414" stroke="#e8e8e8" stroke-width="6"/>
  <text x="1310" y="320" fill="#f2f2f2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" text-anchor="middle">Always-on</text>
  <text x="1310" y="420" fill="#b0b0b0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" text-anchor="middle">gateway / cloud</text>
  <text x="800" y="820" fill="#b0b0b0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" text-anchor="middle">Where Hermes can run</text>
</svg>
