<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Security allowed vs blocked">
  <rect width="1600" height="900" fill="#000000"/>

  <rect x="80" y="180" width="560" height="500" rx="12" fill="#141414" stroke="#e8e8e8" stroke-width="8"/>
  <text x="360" y="300" fill="#f2f2f2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" text-anchor="middle">Allowed</text>
  <text x="360" y="420" fill="#b0b0b0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" text-anchor="middle">project folder</text>
  <text x="360" y="500" fill="#b0b0b0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" text-anchor="middle">AgentShare</text>
  <rect x="960" y="180" width="560" height="500" rx="12" fill="#141414" stroke="#666666" stroke-width="8" stroke-dasharray="16 12"/>
  <text x="1240" y="280" fill="#f2f2f2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" text-anchor="middle">Blocked</text>
  <text x="1240" y="380" fill="#b0b0b0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" text-anchor="middle">private vault</text>
  <text x="1240" y="460" fill="#b0b0b0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" text-anchor="middle">passwords</text>
  <text x="1240" y="540" fill="#b0b0b0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" text-anchor="middle">keys outside</text>
  <text x="800" y="820" fill="#b0b0b0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" text-anchor="middle">Mount only what the task needs</text>
</svg>
