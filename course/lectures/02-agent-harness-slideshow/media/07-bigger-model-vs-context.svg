<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Bigger model vs context">
  <rect width="1600" height="900" fill="#000000"/>

  <rect x="100" y="200" width="600" height="420" rx="12" fill="#141414" stroke="#b0b0b0" stroke-width="6"/>
  <text x="400" y="320" fill="#b0b0b0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" text-anchor="middle">Bigger model</text>
  <text x="400" y="420" fill="#b0b0b0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" text-anchor="middle">alone</text>
  <text x="400" y="520" fill="#b0b0b0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" text-anchor="middle">not enough</text>
  <text x="800" y="420" fill="#f2f2f2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" text-anchor="middle">vs</text>
  <rect x="900" y="200" width="600" height="420" rx="12" fill="#141414" stroke="#e8e8e8" stroke-width="8"/>
  <text x="1200" y="320" fill="#f2f2f2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" text-anchor="middle">Better context</text>
  <text x="1200" y="420" fill="#f2f2f2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" text-anchor="middle">+ checks</text>
  <text x="1200" y="520" fill="#b0b0b0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" text-anchor="middle">structure helps</text>

</svg>
