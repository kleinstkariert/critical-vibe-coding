<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Docker sandbox boundary">
  <rect width="1600" height="900" fill="#000000"/>

  <rect x="120" y="140" width="900" height="620" rx="16" fill="#141414" stroke="#e8e8e8" stroke-width="8"/>
  <text x="570" y="220" fill="#f2f2f2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" text-anchor="middle">Sandbox</text>
  <rect x="280" y="300" width="580" height="280" rx="12" fill="#0a0a0a" stroke="#e8e8e8" stroke-width="6"/>
  <text x="570" y="440" fill="#f2f2f2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" text-anchor="middle">Agent</text>
  <text x="570" y="510" fill="#b0b0b0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" text-anchor="middle">commands stay inside</text>
  <rect x="1100" y="200" width="400" height="480" rx="12" fill="#0a0a0a" stroke="#666666" stroke-width="6" stroke-dasharray="14 10"/>
  <text x="1300" y="340" fill="#b0b0b0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Private</text>
  <text x="1300" y="420" fill="#b0b0b0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" text-anchor="middle">files</text>
  <text x="1300" y="500" fill="#b0b0b0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" text-anchor="middle">outside</text>
  <text x="970" y="400" fill="#b0b0b0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" text-anchor="middle">approved only</text>
  <line x1="860" y1="440" x2="1080" y2="440" stroke="#e8e8e8" stroke-width="5" stroke-dasharray="10 10"/>
  <text x="800" y="820" fill="#b0b0b0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" text-anchor="middle">Container boundary · not a brand logo</text>
</svg>
